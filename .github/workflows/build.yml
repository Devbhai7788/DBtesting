name: Build Minecraft Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip plugin source
        run: unzip DBtesting-plugin-source.zip

      - name: Build with Gradle
        run: |
          cd DBtesting
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DBtesting-plugin
          path: DBtesting/build/libs/*.jar