name: Build Minecraft Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip plugin source
        run: unzip DBtesting-plugin-source.zip

      - name: Find project directory
        run: |
          echo "Searching for build.gradle..."
          PROJECT_DIR=$(dirname "$(find . -name build.gradle | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build with Gradle (no wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DBtesting-plugin
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar